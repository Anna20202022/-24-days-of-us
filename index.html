<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#410b19"><title>24 days of us ♡</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');
:root{--wine:#4d0c20;--cream:#fff1dc;--rose:#dfb2b4;--gold:#d7ac74}*{box-sizing:border-box}body{margin:0;background:#330714;color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh}body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(28,0,8,.05),rgba(36,0,8,.5)),url('background.png') center top/cover no-repeat;z-index:-1}.wrap{max-width:560px;margin:auto;padding:58px 20px 52px}.topline{text-align:center;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#f6d6bc}.heading{text-align:center;margin:24px auto 0;padding:18px 8px 14px;background:linear-gradient(135deg,#fff1dc,#ead1b6);color:#5a1830;box-shadow:0 14px 35px #16020a66;max-width:460px;transform:rotate(-1deg);border:1px solid #e4c49f;border-radius:4px;position:relative}.heading:before{content:'🎀';position:absolute;top:-37px;left:50%;transform:translateX(-50%);font-size:46px}.heading h1{font:clamp(48px,10vw,76px)/1 'Great Vibes',cursive;margin:9px 0 0;font-weight:400}.heading p{font:italic 13px 'Playfair Display',serif;letter-spacing:1px;margin:10px 0 2px}.intro{text-align:center;margin:32px auto 27px;color:#f3d7d1;font:italic 16px/1.6 'Playfair Display',serif}.ornament{text-align:center;color:#e2b28d;letter-spacing:10px;margin-bottom:21px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.door{position:relative;aspect-ratio:1.03;border:0;background:linear-gradient(145deg,#ffefd9,#e6c6aa);border-radius:5px;box-shadow:0 6px 12px #1a000b8a,inset 0 1px 1px #fff8;cursor:pointer;color:#70223b;transition:transform .22s,box-shadow .22s;overflow:visible}.door:before{content:'';position:absolute;inset:0 0 40%;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(175deg,#f9e5cc,#d9b495);filter:drop-shadow(0 2px 1px #7b3d3d45)}.door:after{content:'♥';position:absolute;bottom:9%;left:50%;transform:translateX(-50%);font-size:17px;color:#8f193b;text-shadow:0 2px 2px #4c142b44}.door .num{position:relative;z-index:1;display:block;font:italic clamp(25px,6vw,39px) 'Playfair Display',serif;transform:translateY(-7px)}.door:hover,.door:focus-visible{transform:translateY(-5px);box-shadow:0 8px 24px #e9a97666}.door.featured{outline:2px solid #ffdb99;outline-offset:3px;box-shadow:0 0 28px #f8b96b9e}.door.featured:after{content:'♥';color:#ad133f}.door .bow{position:absolute;z-index:2;top:-17px;right:-10px;font-size:28px;transform:rotate(13deg)}.door .spark{position:absolute;z-index:3;right:5px;bottom:3px;font-size:10px;color:#aa6c43}.foot{text-align:center;margin-top:31px;font:italic 13px 'Playfair Display',serif;color:#efc8b5}.controls{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:22px;font-size:12px;color:#efc9c5}.controls input{accent-color:#e6aeb0}.modal{position:fixed;inset:0;background:#1c000de8;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(10px)}.modal.show{display:flex}.sheet{position:relative;max-width:530px;width:100%;max-height:92dvh;overflow:auto;padding:34px 19px 26px;background:linear-gradient(150deg,#fff3df,#e9cbb1);border-radius:5px;color:#63213b;box-shadow:0 25px 80px #0009;border:1px solid #fce8d3;text-align:center;animation:appear .4s ease}.sheet:before{content:'🎀';font-size:48px;display:block;margin-top:-26px}.sheet h2{font:58px 'Great Vibes',cursive;margin:0 0 15px}.sheet video{width:100%;max-height:55dvh;object-fit:contain;background:#230810;border-radius:4px;display:block;box-shadow:0 9px 24px #53223a44}.sheet .message{font:italic 20px/1.6 'Playfair Display',serif;padding:12px 14px 20px}.sheet .small{font:12px/1.7 'DM Sans',sans-serif;opacity:.7;margin-top:12px}.close{position:absolute;right:12px;top:12px;border:0;background:#70243c;color:#fff1dc;width:34px;height:34px;border-radius:50%;font-size:23px;cursor:pointer}.heart{color:#a02b52;font-size:24px;margin-top:12px}.unlock{display:inline-block;margin:12px 0 0;padding:10px 17px;border-radius:30px;background:#70243c;color:white;border:0;cursor:pointer}.hint{text-align:center;font-size:11px;color:#f6d4c6b8;margin-top:16px}@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@media(min-width:700px){.wrap{padding-top:74px}.grid{gap:18px}.door:after{font-size:23px}.door .bow{font-size:35px}}
</style></head><body><main class="wrap"><div class="topline">a little christmas love story</div><header class="heading"><h1>24 days of us</h1><p>24 little moments, one big love ♡</p></header><p class="intro">A little piece of my heart,<br>waiting for you every day of December.</p><div class="ornament">✦ ♡ ✦</div><section class="grid" id="calendar" aria-label="Advent calendar, 24 days"></section><p class="foot">Made with love, just for you ♡</p><label class="controls"><input id="preview" type="checkbox"> Preview mode — open any day</label><p class="hint">The calendar unlocks one envelope each day, December 1–24.</p></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="daytitle"><div class="sheet"><button class="close" id="close" aria-label="Close">×</button><h2 id="daytitle"></h2><div id="content"></div></div></div><script>
const grid=document.getElementById('calendar'),modal=document.getElementById('modal'),content=document.getElementById('content'),title=document.getElementById('daytitle'),preview=document.getElementById('preview');
for(let i=1;i<=24;i++){const b=document.createElement('button');b.className='door'+(i===14?' featured':'');b.setAttribute('aria-label','Open day '+i);b.innerHTML='<span class="num">'+i+'</span>'+(i===14?'<span class="bow">🎀</span>':'')+(i%5===0?'<span class="spark">✦</span>':'');b.onclick=()=>openDay(i);grid.appendChild(b)}
function unlocked(day){const now=new Date();return preview.checked||(now.getMonth()===11&&now.getDate()>=day)}
function openDay(day){title.textContent='Day '+day;content.replaceChildren();if(!unlocked(day)){content.innerHTML='<div class="message">A little surprise is waiting for you… ♡</div><p class="small">Come back on December '+day+'.</p>';}
else if(day===14){const v=document.createElement('video');v.src='day14.mp4';v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;v.controls=true;v.setAttribute('aria-label','Day 14 original video');content.appendChild(v);v.play().catch(()=>{});}
else{content.innerHTML='<div class="heart">♡</div><div class="message">A little surprise is coming soon.</div><p class="small">This envelope is ready for our next memory.</p>'}
modal.classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('show');document.body.style.overflow='';const v=content.querySelector('video');if(v)v.pause()}
document.getElementById('close').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
